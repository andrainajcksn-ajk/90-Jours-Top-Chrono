<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo 90 Jours Top Chrono</title>
  <desc>Modern logo for the 90 Jours fitness app</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect x="240" y="20" width="200" height="200" rx="40" fill="url(#bg)"/>
  <circle cx="340" cy="105" r="52" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  <circle cx="340" cy="105" r="52" fill="none" stroke="url(#arc)" stroke-width="4" stroke-dasharray="220 100" stroke-linecap="round" transform="rotate(-90 340 105)"/>
  <circle cx="340" cy="53" r="4" fill="#a5f3fc"/>
  <circle cx="340" cy="157" r="4" fill="#a5f3fc"/>
  <circle cx="288" cy="105" r="4" fill="#a5f3fc"/>
  <circle cx="392" cy="105" r="4" fill="#a5f3fc"/>
  <line x1="340" y1="105" x2="340" y2="72" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="105" x2="365" y2="105" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="340" cy="105" r="5" fill="#ffffff"/>
  <text x="340" y="185" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">90</text>
  <text x="340" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle" letter-spacing="4">JOURS</text>
  <text x="340" y="248" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#0e7490" text-anchor="middle" letter-spacing="6">TOP CHRONO</text>
  <line x1="290" y1="238" x2="320" y2="238" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="238" x2="390" y2="238" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
</svg>
